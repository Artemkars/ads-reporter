name: Weekly Ads Report

on:
  # Ручной запуск из GitHub UI или через API (веб-дашборд)
  workflow_dispatch:
    inputs:
      rate_usd_kzt:
        description: 'Курс USD/₸'
        required: true
        default: '490'
      vat_pct:
        description: 'НДС + АК %'
        required: true
        default: '12'
      date_from:
        description: 'Период ОТ: YYYY-MM-DD (пусто = последние 7 дней)'
        required: false
        default: ''
      date_to:
        description: 'Период ДО: YYYY-MM-DD (пусто = последние 7 дней)'
        required: false
        default: ''
      client:
        description: 'Кабинет (ключ из config.yaml, например: amk)'
        required: false
        default: ''

jobs:
  generate-report:
    name: Generate & Upload Report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build CLI args
        id: args
        run: |
          ARGS="--rate ${{ github.event.inputs.rate_usd_kzt }} --vat ${{ github.event.inputs.vat_pct }}"

          if [ -n "${{ github.event.inputs.date_from }}" ]; then
            ARGS="$ARGS --date-from ${{ github.event.inputs.date_from }}"
          fi
          if [ -n "${{ github.event.inputs.date_to }}" ]; then
            ARGS="$ARGS --date-to ${{ github.event.inputs.date_to }}"
          fi
          if [ -n "${{ github.event.inputs.client }}" ]; then
            ARGS="$ARGS --client ${{ github.event.inputs.client }}"
          fi

          echo "cli_args=$ARGS" >> $GITHUB_OUTPUT

      - name: Run report → Google Sheets
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          AMK_ACT_ID: ${{ secrets.AMK_ACT_ID }}
          # Добавьте при подключении новых кабинетов:
          # JETQ_ACT_ID: ${{ secrets.JETQ_ACT_ID }}
          # MTZ_ACT_ID: ${{ secrets.MTZ_ACT_ID }}
          # AUDI_ACT_ID: ${{ secrets.AUDI_ACT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_DEVELOPER_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_LOGIN_CUSTOMER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          python run_report.py ${{ steps.args.outputs.cli_args }} --no-excel --sheets-id $GOOGLE_SPREADSHEET_ID
